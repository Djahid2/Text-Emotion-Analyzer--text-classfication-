services : 

  frontend :
    build :
      context: ./frontend
    container_name: frontend
    ports :
      - "3000:3000"
    volumes :
      - ./frontend:/app
      - /app/node_modules
    depends_on :
      - backend
    
  
  backend :
    build :
      context: ./backend
    container_name: backend
    ports :
      - "8000:8000"
    volumes :
      - ./backend:/app
      
